schema_version: 1

context:
  version: 9.2.0
  python_min: '3.10'

package:
  name: pytest
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest/pytest-${{ version }}.tar.gz
  sha256: 97c4f3b1f3c7414aa36465e09b8220f1d03627993bd51b1282e193753c80557b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pytest = _pytest.config:_console_main
      - py.test = _pytest.config:_console_main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools_scm >=6.2.3
  run:
    - pygments >=2.15
    - python >=${{ python_min }}
    - iniconfig >=2
    - packaging >=24
    - pluggy >=1.6,<2
    - tomli >=2
    - exceptiongroup >=1
  run_constraints:
    - pytest-faulthandler >=2

tests:
  - python:
      imports:
        - pytest
      python_version:
        - ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - pytest -h

about:
  license: MIT
  license_file: LICENSE
  summary: Simple and powerful testing with Python.
  description: |
    The pytest framework makes it easy to write small tests, yet scales to
    support complex functional testing for applications and libraries.
  homepage: https://docs.pytest.org/en/latest/
  repository: https://github.com/pytest-dev/pytest/
  documentation: https://docs.pytest.org/en/latest/

extra:
  recipe-maintainers:
    - flub
    - goanpeca
    - nicoddemus
    - ocefpaf
    - mingwandroid
